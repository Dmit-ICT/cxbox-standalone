version: '3'

services:
  postgres:
    image: pgvector/pgvector:pg16
    # restart: always
    ports:
      - '5433:5432'
    volumes:
      - /Users/bomdmit/DockerVolumes/cxbox-standalone:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=standalone_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Password1234!

  redis:
    image: redis:alpine
    # restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis:/data
    ports:
      - '6379:6379'

  mailhog:
    image: mailhog/mailhog
    ports:
      - 1025:1025
      - 8025:8025

volumes:
  redis:  # Keep this for redis named volume